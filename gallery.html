<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 · 图片预览</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <!-- 顶部栏：品牌 + 来源信息 -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4f46e5" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#brandGradient)" />
          <rect x="7" y="7" width="18" height="18" rx="5" fill="none" stroke="#ffffff" stroke-width="2" />
          <circle cx="13" cy="13" r="1.8" fill="#ffffff" />
          <path d="M25 20l-5-5-9 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="brand__text">
          <span class="brand__name">图提取</span>
          <span class="brand__sub">ImageGrab</span>
        </div>
      </div>

      <div class="source" id="source" hidden>
        <span class="source__platform" id="sourcePlatform"></span>
        <a class="source__title" id="sourceTitle" href="#" target="_blank" rel="noreferrer"></a>
      </div>

      <div class="topbar__actions">
        <button class="ghost-btn" id="btnClear" type="button" title="清空当前列表">清空</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 标题区 -->
    <section class="hero" id="hero" hidden>
      <h1 class="hero__title">已提取 <strong id="totalCount">0</strong> 张图片</h1>
      <p class="hero__desc">勾选需要的图片，一键批量下载为 PNG 格式，文件名按顺序自动编号。</p>
    </section>

    <!-- 操作栏 -->
    <section class="toolbar" id="toolbar" hidden>
      <div class="toolbar__left">
        <label class="check check--all">
          <input type="checkbox" id="checkAll" />
          <span>全选</span>
        </label>
        <button class="text-btn" id="btnInvert" type="button">反选</button>
        <span class="divider" aria-hidden="true"></span>
        <span class="selected">已选 <b id="selectedCount">0</b> 张</span>
      </div>
      <div class="toolbar__right">
        <button class="primary-btn" id="btnDownload" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v11" />
            <path d="M7.5 10.5L12 15l4.5-4.5" />
            <path d="M5 19h14" />
          </svg>
          <span id="btnDownloadText">下载选中</span>
        </button>
      </div>
    </section>

    <!-- 图片网格 -->
    <section class="grid" id="grid" aria-live="polite"></section>

    <!-- 空状态 -->
    <section class="empty" id="empty">
      <div class="empty__art" aria-hidden="true">
        <svg viewBox="0 0 200 140" width="200" height="140">
          <rect x="24" y="18" width="152" height="104" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2" />
          <rect x="40" y="34" width="52" height="52" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
          <circle cx="58" cy="50" r="5" fill="#c7d2fe" />
          <path d="M46 78l14-14 10 10 7-7 12 12" fill="none" stroke="#a5b4fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="104" y="34" width="56" height="10" rx="5" fill="#c7d2fe" />
          <rect x="104" y="52" width="40" height="10" rx="5" fill="#e0e7ff" />
          <rect x="104" y="70" width="48" height="10" rx="5" fill="#e0e7ff" />
          <rect x="40" y="98" width="120" height="10" rx="5" fill="#e0e7ff" />
        </svg>
      </div>
      <h2 class="empty__title">还没有提取任何图片</h2>
      <p class="empty__desc">
        打开淘宝 / 天猫、京东或拼多多的商品详情页，点击页面右下角的
        <span class="chip">获取图片</span> 按钮即可。
      </p>
      <p class="empty__hint">提示：先在详情页从上到下滚动一遍，让懒加载图片加载出来，再点击按钮效果更好。</p>
    </section>
  </main>

  <!-- 下载进度条（底部悬浮） -->
  <div class="progress" id="progress" hidden>
    <div class="progress__head">
      <span class="progress__label" id="progressLabel">正在下载…</span>
      <span class="progress__count" id="progressCount">0/0</span>
    </div>
    <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
  </div>

  <!-- 结果提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="gallery.js"></script>
</body>
</html>
